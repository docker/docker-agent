# A team for the small browser build (cmd/wasm, -tags docker_agent_wasm_small);
# it also runs in the default build and in the CLI.
#
# The small build keeps the OpenAI-compatible providers and the portable
# toolsets, and resolves ${env.NAME} placeholders without evaluating
# JavaScript. It has no openapi toolset, code mode or add_context hook, and
# accepts only the current config version. See ../README.md.

providers:
  openrouter:
    provider: openai
    base_url: https://openrouter.ai/api/v1
    token_key: OPENROUTER_API_KEY

models:
  fast:
    provider: openrouter
    model: meta-llama/llama-3.3-70b-instruct:free
  careful:
    provider: openrouter
    model: qwen/qwen3-235b-a22b:free

agents:
  root:
    model: fast
    description: Plans research and delegates lookups.
    instruction: |
      You coordinate a small research team for ${env.USER_NAME}.
      Break the request into todos, keep the shared plan up to date, and hand
      lookups to the researcher. Ask the user with user_prompt when a choice
      matters. Answer in at most three paragraphs.
    sub_agents: [researcher]
    add_date: true
    toolsets:
      - type: think
      - type: todo
        shared: true
      - type: plan
      - type: memory
      - type: user_prompt
      - type: model_picker
        models: [fast, careful]
    hooks:
      before_llm_call:
        - type: builtin
          command: redact_secrets

  researcher:
    model: careful
    description: Looks things up on the web and on GitHub.
    instruction: |
      Look things up, record findings in the shared plan and report back.
      Prefer the GitHub tools for repository questions.
    toolsets:
      - type: todo
        shared: true
      - type: plan
      - type: fetch
        toon: fetch
      - type: api
        api_config:
          name: github_search_repos
          method: GET
          endpoint: https://api.github.com/search/repositories?q=${q}&per_page=5
          headers:
            Authorization: Bearer ${env.GITHUB_TOKEN}
            Accept: application/vnd.github+json
          instruction: Search GitHub repositories. Returns the top five matches.
          args:
            q:
              type: string
              description: Search query.
          required: [q]
      - type: mcp
        remote:
          url: https://api.githubcopilot.com/mcp/
          headers:
            Authorization: Bearer ${env.GITHUB_TOKEN}
        defer: true
