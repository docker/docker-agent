[package]
name = "docker-agent-portable"
version = "0.1.0"
publish = false
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dashu-base = "0.4"
dashu-int = { version = "0.4", default-features = false }
dashu-ratio = { version = "0.4", default-features = false }
indexmap = { version = "2", features = ["serde"] }
regex = { version = "1", default-features = false, features = ["std", "unicode-case"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_yaml_ng = "0.10"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "z"
strip = true
