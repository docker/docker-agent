name: Set up Binaryen
description: Install the pinned wasm-opt for the Linux x86-64 WASM job.

runs:
  using: composite
  steps:
    - shell: bash
      env:
        BINARYEN_VERSION: '132'
        BINARYEN_SHA256: 195ddc94f9bc89f45abdabb0b9eea86023d727ba90eac8b35b80f2544fc30572
      run: |
        set -euo pipefail
        release="binaryen-version_${BINARYEN_VERSION}"
        archive="${RUNNER_TEMP}/${release}-x86_64-linux.tar.gz"
        curl -fsSLo "$archive" "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/${archive##*/}"
        echo "${BINARYEN_SHA256}  ${archive}" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/binaryen"
        tar -xzf "$archive" -C "$RUNNER_TEMP/binaryen" --strip-components=2 "$release/bin/wasm-opt"
