# Lints and tests the models-delta scripts (.github/scripts/models-delta*.jq,
# scripts/models-delta*.sh) used by update-models.yml to compute a semantic
# models.dev catalog diff. Split out from ci.yml's blanket lint job — which
# runs on every PR/commit across the whole repo — since this only needs to
# run when these scripts or their fixtures actually change.
name: models-delta-lint

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/models-delta-lint.yml"
      - ".github/scripts/models-delta.jq"
      - ".github/scripts/models-delta-render.jq"
      - ".github/scripts/testdata/**"
      - "scripts/models-delta.sh"
      - "scripts/models-delta-test.sh"
      - "Taskfile.yml"
  pull_request:
    paths:
      - ".github/workflows/models-delta-lint.yml"
      - ".github/scripts/models-delta.jq"
      - ".github/scripts/models-delta-render.jq"
      - ".github/scripts/testdata/**"
      - "scripts/models-delta.sh"
      - "scripts/models-delta-test.sh"
      - "Taskfile.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Lint models-delta scripts
        run: |
          shellcheck scripts/models-delta.sh scripts/models-delta-test.sh
          ./scripts/models-delta-test.sh
