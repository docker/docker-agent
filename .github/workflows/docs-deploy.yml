# Builds the documentation site in docs/ with Hugo and publishes it to
# GitHub Pages (docker.github.io/docker-agent). docs.docker.com renders the
# same Markdown source through its Hugo module mount (see docs.yml, upstream).
name: docs-deploy

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs-deploy.yml"
      - ".github/actions/setup-hugo/**"
      - "docs/**"
  workflow_dispatch:

jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-hugo

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build site
        working-directory: docs
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: hugo --gc --baseURL "${BASE_URL}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/public

  deploy:
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
