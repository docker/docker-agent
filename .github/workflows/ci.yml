name: ci

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  workflow_dispatch:
    inputs:
      image_mode:
        description: Publish on main with auto; test images without publishing on other branches or with build-only
        type: choice
        required: false
        default: auto
        options:
          - auto
          - build-only
      expected_sha:
        description: Optional immutable 40-character commit SHA to verify before authentication
        type: string
        required: false
        default: ''
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1

      - name: Lint GitHub Actions
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          fail-on-error: true
          pyflakes: false

      - name: Lint GitHub Workflows
        run: ./scripts/workflow-lint.sh

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
        with:
          version: 3.51.1

      - name: Create bin directory
        run: mkdir -p "$HOME/bin"

      - name: Build
        run: task build

      - name: Cross-compile plan storage
        run: task check-plan-cross

      - name: Run tests
        run: |
          task test
          task test-binary

      - name: Test WASM provider registration
        run: task test-wasm-providers

  # Native Windows tests. Plan storage relies on OS-specific file locking and
  # path semantics, so the full Go test suite runs natively on Windows in a
  # single blocking `task test` step, mirroring the Linux job.
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
        with:
          version: 3.51.1

      - name: Go environment
        run: go env GOOS GOARCH CGO_ENABLED CC

      - name: Run tests
        run: task test

  license-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install go-licences
        run: go install github.com/google/go-licenses@latest

      - name: Check licenses
        run: go-licenses check . --allowed_licenses=Apache-2.0,MIT,BSD-3-Clause,BSD-2-Clause --ignore modernc.org/mathutil --ignore github.com/hashicorp/hcl/v2

  build-image:
    if: >-
      github.repository == 'docker/docker-agent' &&
      github.event.repository.fork == false && (
        (github.event_name == 'pull_request' &&
          github.event.pull_request.base.repo.full_name == github.repository) ||
        (github.event_name == 'workflow_dispatch' &&
          startsWith(github.ref, 'refs/heads/') &&
          (github.ref != 'refs/heads/main' || inputs.image_mode == 'build-only') &&
          (inputs.image_mode == '' || inputs.image_mode == 'auto' || inputs.image_mode == 'build-only'))
      )
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    env:
      DOCKER_BUILD_CLOUD_ENDPOINT: docker/docker-agent
      DOCKERHUB_OIDC_CONNECTION_ID: ${{ vars.DOCKERHUB_OIDC_CONNECTION_ID }}
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      DOCKER_BUILD_SUMMARY: 'false'
    # Cloud workers compile each native platform in parallel; GitHub runners
    # only orchestrate the builds.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate Docker Build Cloud configuration
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_INPUT_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Workflow run commit must be a lowercase 40-character SHA" >&2
            exit 1
          fi
          if [[ -n "${EXPECTED_INPUT_SHA}" ]]; then
            if [[ ! "${EXPECTED_INPUT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "expected_sha must be a lowercase 40-character SHA" >&2
              exit 1
            fi
            if [[ "${EXPECTED_INPUT_SHA}" != "${EXPECTED_SHA}" ]]; then
              echo "expected_sha does not match the workflow run commit" >&2
              exit 1
            fi
          fi
          if ! checked_out_sha="$(git rev-parse HEAD)"; then
            echo "Unable to determine the checked out commit" >&2
            exit 1
          fi
          if [[ "${checked_out_sha}" != "${EXPECTED_SHA}" ]]; then
            echo "Checked out commit does not match the workflow run commit" >&2
            exit 1
          fi
          if [[ -z "${DOCKERHUB_OIDC_CONNECTION_ID}" ]]; then
            echo "DOCKERHUB_OIDC_CONNECTION_ID must be configured" >&2
            exit 1
          fi
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "GitHub Actions OIDC is unavailable for this workflow run" >&2
            exit 1
          fi

      - name: Get Docker Build Cloud OIDC token
        id: docker_oidc
        uses: docker/oidc-action@b048fb089ace3e15a5fbdd784f4784d284ce5e8d # v1.1.0
        with:
          connection-id: ${{ env.DOCKERHUB_OIDC_CONNECTION_ID }}
          expires-in: 3600

      - name: Docker login
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: docker
          password: ${{ steps.docker_oidc.outputs.token }}

      - name: Set up Docker Build Cloud
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver: cloud
          endpoint: ${{ env.DOCKER_BUILD_CLOUD_ENDPOINT }}
          version: lab:edge

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=cacheonly
          push: false
          load: false
          sbom: false
          provenance: false
          github-token: ''
          build-args: |
            GIT_TAG=pr
            GIT_COMMIT=dev

      - name: Build template
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          target: template
          platforms: ${{ matrix.platform }}
          outputs: type=cacheonly
          push: false
          load: false
          sbom: false
          provenance: false
          github-token: ''
          build-args: |
            GIT_TAG=pr
            GIT_COMMIT=dev

  build-and-push-image:
    if: >-
      github.repository == 'docker/docker-agent' &&
      github.event.repository.fork == false && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          (inputs.image_mode == '' || inputs.image_mode == 'auto'))
      )
    needs: [ lint, build-and-test, windows-tests, license-check ]
    permissions:
      contents: read
      id-token: write
    env:
      DOCKER_BUILD_CLOUD_ENDPOINT: docker/docker-agent
      DOCKERHUB_OIDC_CONNECTION_ID: ${{ vars.DOCKERHUB_OIDC_CONNECTION_ID }}
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      DOCKER_BUILD_SUMMARY: 'false'
    # Cloud workers build each native platform in parallel and push by digest;
    # the merge jobs below assemble the multi-arch manifests.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate Docker Build Cloud configuration
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_INPUT_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Workflow run commit must be a lowercase 40-character SHA" >&2
            exit 1
          fi
          if [[ -n "${EXPECTED_INPUT_SHA}" ]]; then
            if [[ ! "${EXPECTED_INPUT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "expected_sha must be a lowercase 40-character SHA" >&2
              exit 1
            fi
            if [[ "${EXPECTED_INPUT_SHA}" != "${EXPECTED_SHA}" ]]; then
              echo "expected_sha does not match the workflow run commit" >&2
              exit 1
            fi
          fi
          if ! checked_out_sha="$(git rev-parse HEAD)"; then
            echo "Unable to determine the checked out commit" >&2
            exit 1
          fi
          if [[ "${checked_out_sha}" != "${EXPECTED_SHA}" ]]; then
            echo "Checked out commit does not match the workflow run commit" >&2
            exit 1
          fi
          if [[ -z "${DOCKERHUB_OIDC_CONNECTION_ID}" ]]; then
            echo "DOCKERHUB_OIDC_CONNECTION_ID must be configured" >&2
            exit 1
          fi
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "GitHub Actions OIDC is unavailable for this workflow run" >&2
            exit 1
          fi

      - name: Prepare platform name
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - name: Get Docker Hub OIDC token
        id: docker_oidc
        uses: docker/oidc-action@b048fb089ace3e15a5fbdd784f4784d284ce5e8d # v1.1.0
        with:
          connection-id: ${{ env.DOCKERHUB_OIDC_CONNECTION_ID }}
          expires-in: 3600

      - name: Hub login
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: docker
          password: ${{ steps.docker_oidc.outputs.token }}

      - name: Set up Docker Build Cloud
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver: cloud
          endpoint: ${{ env.DOCKER_BUILD_CLOUD_ENDPOINT }}
          version: lab:edge

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            docker/docker-agent

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          load: false
          github-token: ''
          sbom: true
          provenance: mode=max
          outputs: type=image,name=docker/docker-agent,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            GIT_TAG=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}

      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      # The sandbox template is a stage of the same Dockerfile with identical
      # build args, so it reuses the builder-linux layer from the image build
      # above and embeds the exact same binary.
      - name: Build and push template by digest
        id: build-template
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          target: template
          platforms: ${{ matrix.platform }}
          load: false
          github-token: ''
          sbom: true
          provenance: mode=max
          outputs: type=image,name=docker/docker-agent-sbx-templates,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            GIT_TAG=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}

      - name: Export template digest
        env:
          DIGEST: ${{ steps.build-template.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/template-digests"
          touch "${RUNNER_TEMP}/template-digests/${DIGEST#sha256:}"

      - name: Upload template digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: template-digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/template-digests/*
          if-no-files-found: error
          retention-days: 1

  merge-and-push-image:
    if: >-
      github.repository == 'docker/docker-agent' &&
      github.event.repository.fork == false && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          (inputs.image_mode == '' || inputs.image_mode == 'auto'))
      )
    needs: [ build-and-push-image ]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Get Docker Hub OIDC token
        id: docker_oidc
        uses: docker/oidc-action@b048fb089ace3e15a5fbdd784f4784d284ce5e8d # v1.1.0
        with:
          connection-id: ${{ vars.DOCKERHUB_OIDC_CONNECTION_ID }}
          expires-in: 3600

      - name: Hub login
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: docker
          password: ${{ steps.docker_oidc.outputs.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            docker/docker-agent
          tags: |
            type=semver,pattern={{version}}
            type=edge
            type=ref,event=pr

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          args=()
          for tag in "${tags[@]}"; do args+=(-t "$tag"); done
          for digest in *; do args+=("docker/docker-agent@sha256:${digest}"); done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect image
        run: |
          docker buildx imagetools inspect docker/docker-agent:${{ steps.meta.outputs.version }}

  merge-and-push-template:
    if: >-
      github.repository == 'docker/docker-agent' &&
      github.event.repository.fork == false && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          (inputs.image_mode == '' || inputs.image_mode == 'auto'))
      )
    needs: [ build-and-push-image ]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Download template digests
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: ${{ runner.temp }}/template-digests
          pattern: template-digests-*
          merge-multiple: true

      - name: Get Docker Hub OIDC token
        id: docker_oidc
        uses: docker/oidc-action@b048fb089ace3e15a5fbdd784f4784d284ce5e8d # v1.1.0
        with:
          connection-id: ${{ vars.DOCKERHUB_OIDC_CONNECTION_ID }}
          expires-in: 3600

      - name: Hub login
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: docker
          password: ${{ steps.docker_oidc.outputs.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Assemble the multi-arch manifest list from the per-arch digests pushed
      # by build-and-push-image. On main only the edge tag moves; on a v* tag
      # both the version tag and the floating latest tag that sandboxes pulls
      # by default.
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/template-digests
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tags=(-t "docker/docker-agent-sbx-templates:${GITHUB_REF_NAME#v}" -t "docker/docker-agent-sbx-templates:latest")
          else
            tags=(-t "docker/docker-agent-sbx-templates:edge")
          fi
          args=()
          for digest in *; do args+=("docker/docker-agent-sbx-templates@sha256:${digest}"); done
          docker buildx imagetools create "${tags[@]}" "${args[@]}"

      - name: Inspect template
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then tag="${GITHUB_REF_NAME#v}"; else tag="edge"; fi
          docker buildx imagetools inspect "docker/docker-agent-sbx-templates:${tag}"
