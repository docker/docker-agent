# A two-agent "plan then execute" workflow.
#
# The user starts in `root`. Typing `/plan` switches to `planner`, which has
# read-only tools and the plan toolset. The planner investigates the request,
# writes the plan to <data-dir>/plans/<session-id>.md, and calls
# exit_plan_mode when ready — that signal tells the host the plan is final.
# Switching back to `root` for execution is up to the host (toggle, slash
# command, an explicit handoff on the agent, …); the tool itself does not
# move the conversation.

agents:
  root:
    model: anthropic/claude-sonnet-4-5
    description: Executes plans the planner has handed off
    instruction: |
      You execute plans the planner has prepared. When you see a message
      saying a plan has been approved, read it with read_plan and work
      through its steps in order. For ambiguous or multi-file changes that
      have not been planned yet, type `/plan <task>` first instead of
      starting work directly.
    toolsets:
      - type: plan
        tools:
          - read_plan
      - type: filesystem
      - type: shell
    commands:
      plan:
        description: "Switch to the planner"
        agent: planner

  planner:
    model: anthropic/claude-sonnet-4-5
    description: Investigates the request and writes a plan for user approval
    instruction: |
      Investigate the user's request with read-only tools, then draft the
      plan with write_plan. Iterate — re-read code, ask clarifying
      questions with user_prompt — until the plan is complete. When the
      plan is final, call exit_plan_mode to mark it ready for review.

      Do not modify any files. The only write you may perform is write_plan.
    toolsets:
      - type: plan
      - type: filesystem
        readonly: true
      - type: fetch
      - type: user_prompt
