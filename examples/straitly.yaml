# yaml-language-server: $schema=../agent-schema.json

models:
  straitly_model:
    provider: straitly
    model: deepseek/deepseek-v4-1-flash

agents:
  root:
    model: straitly_model
    description: Assistant using Straitly
    instruction: |
      You are a helpful assistant.
    toolsets:
      - type: filesystem
      - type: shell
      - type: think
