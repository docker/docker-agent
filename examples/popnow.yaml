# yaml-language-server: $schema=../agent-schema.json

models:
  popnow_model:
    provider: popnow
    model: deepseek/v4-flash/chat

agents:
  root:
    model: popnow_model
    description: Assistant using PopNow
    instruction: |
      You are a helpful assistant.
    toolsets:
      - type: filesystem
      - type: shell
      - type: think
