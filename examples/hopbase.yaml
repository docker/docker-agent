# yaml-language-server: $schema=../agent-schema.json

models:
  hopbase_model:
    provider: hopbase
    model: glm-5.3

agents:
  root:
    model: hopbase_model
    description: Assistant using HopBase
    instruction: |
      You are a helpful assistant.
    toolsets:
      - type: filesystem
      - type: shell
      - type: think
